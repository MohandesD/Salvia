# Salvia built-in theme.
#
# This file reproduces the historical frontend. Leaving salvia.cfg on
# theme=default (or deleting that line) loads this directory. If the file
# itself is missing, the same look is compiled in as a fallback.
#
# Copy this folder to assets/themes/<your-name>/ and point salvia.cfg at it:
#   theme=your-name
# Or pick it under Options > Video > Theme. See THEMES.md.

name = Salvia
author = danibiker

# boxes | list | grid | carousel
view = boxes
# left | center | right
align = left
# bar | outline | underline | none
selection = bar
# -1 keeps the historical highlight opacity
selection_alpha = -1
# both | text | image
system_title = both

# keep | tiles | image | plasma | purple | wormhole | none
# keep means "use animBG from salvia.cfg" (moving tiles by default).
background = keep
background_dim = -1
background_per_system = yes
background_image =

# -1 = built-in margin (about 1% of the screen width, header is two text rows)
margin_x = -1
margin_y = -1
item_spacing = 0
item_padding = 8
grid_columns = 4
carousel_visible = 5

# Empty font uses the embedded Arimo face. font_size 0 scales 24px at 720p.
font =
font_size = 0
font_small_delta = 9

show_header = yes
show_footer = yes
show_clock = yes
show_nav_bar = yes
show_scrollbar = yes
show_icons = yes
show_separator = yes
show_artwork = yes

header_text =
footer_text =

# Palette. color.black stays #010101 (not pure black) so the alpha-fixup
# shader can tell a real pixel from an empty one. Do not set it to #000000.
color.background = #000000
color.black = #010101
color.white = #FFFFFF
color.yellow = #F1DE13
color.red = #FF0000
color.blue = #4CC2FF
color.menu = #F7DD72
color.menu_lighter = #EDDD96
color.panel = #282828
color.border = #C8C8C8
color.bars = #808080
color.nav = #8ACFB2
color.text_dim = #A0A0A0
color.switch_on = #C8C8C8
color.switch_off = #4D4D4D
color.pale_blue = #39485D
color.dialog_title = #3B3B3B
color.dialog_bg = #454545
color.dialog_line = #5B5B5B
color.dialog_text = #BEBEBE
color.highlight = #00FFC5
color.list_text = #FFFFFF
color.list_text_selected = #010101
color.header = #FFFFFF
color.footer = #FFFFFF
color.selection = #F7DD72
