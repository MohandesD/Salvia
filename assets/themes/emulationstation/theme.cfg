# Clean system-list theme.
#
# Inspired by the quiet EmulationStation system list (dark field, centered
# names, a single colored selection bar, a short help line). It is not a copy
# of EmulationStation's assets, fonts, or logos. Drop your own .ttf on `font`
# if you want a different typeface; otherwise Salvia's built-in face is scaled up.
#
# Select it with theme=emulationstation in salvia.cfg, or
# Options > Video > Theme. A restart is not required for colors and layout;
# a font file is picked up immediately as well.

name = EmulationStation
author = Salvia

view = list
align = center
selection = bar
selection_alpha = 210
system_title = text

# Solid-looking field. background.png is a quiet gradient shipped with this
# theme. Set background=none to use only color.background, or background=tiles
# / plasma / purple / wormhole for the animated modes Salvia already has.
# background_per_system=no keeps this image on every platform. Set it to yes
# to prefer each core's assets/<system>/background.jpg when that file exists.
background = image
background_image = background.png
background_dim = 0
background_per_system = no

margin_x = 180
margin_y = 96
item_spacing = 16
item_padding = 18
grid_columns = 4
carousel_visible = 5

font =
font_size = 32
font_small_delta = 12

show_header = yes
show_footer = no
show_clock = yes
show_nav_bar = no
show_scrollbar = no
show_icons = no
show_separator = no
show_artwork = no

header_text =
footer_text = A  Start      B  Back

color.background = #071018
color.black = #010101
color.white = #F4F7FB
color.yellow = #F1DE13
color.red = #E85D4C
color.blue = #7EB6FF
color.menu = #1C6DD0
color.menu_lighter = #2B7DE0
color.panel = #0C1622
color.border = #1C3F66
color.bars = #16324F
color.nav = #8FB7E8
color.text_dim = #8AA0B8
color.switch_on = #1C6DD0
color.switch_off = #243140
color.pale_blue = #16324F
color.dialog_title = #0E1A28
color.dialog_bg = #101820
color.dialog_line = #1C3F66
color.dialog_text = #D5DDE6
color.highlight = #7EB6FF
color.list_text = #D5DDE6
color.list_text_selected = #FFFFFF
color.header = #F4F7FB
color.footer = #9FB3C8
color.selection = #1C6DD0
